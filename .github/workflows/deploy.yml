name: Deploy ByteQuant to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Configure pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.7.0
      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Refresh allowlisted official feeds
        run: pnpm sync:news
      - name: Lint TypeScript and React
        run: pnpm lint
      - name: Audit production licenses
        run: pnpm audit:licenses
      - name: Build static site
        run: pnpm build
      - name: Run application tests
        run: pnpm test
      - name: Audit generated static output
        run: pnpm audit:static
      - name: Audit AdSense policy surfaces
        run: pnpm audit:adsense
      - name: Audit canonical content value
        run: pnpm audit:content
      - name: Audit original, task-specific content contracts
        run: pnpm audit:authenticity
      - name: Audit indexable publisher content surfaces
        run: pnpm audit:publisher-surface
      - name: Audit editorial depth
        run: pnpm audit:editorial
      - name: Audit publisher trust
        run: pnpm audit:trust
      - name: Audit tool quality inventory
        run: pnpm audit:inventory
      - name: Audit AdSense remediation Stage 1
        run: pnpm audit:stage1
      - name: Audit AdSense remediation Stage 2
        run: pnpm audit:stage2
      - name: Audit AdSense remediation Stage 3
        run: pnpm audit:stage3
      - name: Audit AdSense remediation Stage 4
        run: pnpm audit:stage4
      - name: Audit AdSense closure Stage 1
        run: pnpm audit:closure1
      - name: Audit AdSense closure Stage 2
        run: pnpm audit:closure2
      - name: Audit AdSense closure Stage 3
        run: pnpm audit:closure3
      - name: Audit AdSense quality program Stage 1
        run: pnpm audit:quality1
      - name: Audit AdSense quality program Stage 2
        run: pnpm audit:quality2
      - name: Audit AdSense quality program Stage 3
        run: pnpm audit:quality3
      - name: Audit AdSense quality program Stage 4
        run: pnpm audit:quality4
      - name: Audit every rendered page and stylesheet
        run: pnpm audit:experience
      - name: Audit final release readiness
        run: pnpm audit:release
      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: out
          include-hidden-files: true
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        env:
          NODE_OPTIONS: --use-system-ca
